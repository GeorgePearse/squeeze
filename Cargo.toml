[package]
name = "squeeze"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "CPU-optimized dimensionality reduction algorithms in Rust"
license = "Apache-2.0"
repository = "https://github.com/GeorgePearse/squeeze"

[dependencies]
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }
rayon = "1.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.9.2"
rand_distr = "0.5"
ordered-float = "4.2"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "hnsw_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
