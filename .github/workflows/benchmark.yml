name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset:
        description: Benchmark dataset
        type: choice
        options: [digits, fashion-mnist]
        default: digits

permissions:
  contents: read

jobs:
  benchmark:
    name: Dataset comparison
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      BENCHMARK_DATASET: ${{ inputs.dataset || 'digits' }}
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: pyproject.toml
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install BLAS build dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev libssl-dev gfortran pkg-config
      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --extra benchmark --no-install-project
      - name: Build release extension
        run: uv run --no-sync maturin develop --release --features extension-module,ndarray-linalg/openblas-system
      - name: Compare algorithms on the selected dataset
        run: |
          uv run --no-sync python -m scripts.benchmark_neighbors --dataset "$BENCHMARK_DATASET" --output benchmark-artifacts
          uv run --no-sync python -m scripts.report_neighbors benchmark-artifacts
      - name: Require successful benchmark fits
        run: |
          uv run --no-sync python -c 'import json; r = json.load(open("benchmark-artifacts/results.json")); assert all(x["status"] == "ok" for x in r["runs"]), "Benchmark failures are recorded in results.json"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-results-${{ env.BENCHMARK_DATASET }}
          path: benchmark-artifacts/
