name: Rust graph embeddings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neighbor-map:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .uv-version
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install BLAS build dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev libssl-dev gfortran pkg-config
      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --no-install-project
      - name: Build release extension against system OpenBLAS
        run: uv run --no-sync maturin develop --release --features extension-module,ndarray-linalg/openblas-system
      - name: Test Rust graph and distance kernels
        run: |
          cargo test --release --lib --features ndarray-linalg/openblas-system neighbor_map::tests
          cargo test --release --lib --features ndarray-linalg/openblas-system metrics_simd::squared::tests
      - name: Test Python embedding contracts
        run: uv run --no-sync pytest squeeze/tests/test_neighbor_map.py squeeze/tests/test_neighbor_benchmark.py
