site_name: Squeeze
site_description: CPU dimensionality reduction in Python and Rust, with reproducible benchmarks.
site_author: George Pearse
site_url: https://georgepearse.github.io/squeeze/
repo_url: https://github.com/GeorgePearse/squeeze
repo_name: GeorgePearse/squeeze
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  font: false
  icon:
    logo: material/vector-polyline
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
extra_css:
  - stylesheets/squeeze.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Squeeze: index.md
  - Start:
      - Installation: installation.md
      - Quick start: basic_usage.md
      - Data and preprocessing: data.md
  - Algorithms:
      - Choose an algorithm: algorithms/index.md
      - PCA: algorithms/pca.md
      - UMAP: algorithms/umap.md
      - t-SNE: algorithms/tsne.md
      - MDS: algorithms/mds.md
      - Isomap: algorithms/isomap.md
      - LLE: algorithms/lle.md
      - PHATE: algorithms/phate.md
      - TriMap: algorithms/trimap.md
      - PaCMAP: algorithms/pacmap.md
      - NeighborMap: algorithms/neighbor-map.md
      - SpectralMap: algorithms/spectral-map.md
      - UMAP variants: algorithms/variants.md
  - Use Squeeze:
      - Parameters: parameters.md
      - Transform new data: transform.md
      - Streaming: streaming.md
      - Composition: composing_models.md
      - Strategy registry: strategies.md
      - Plotting and reports: plotting.md
  - Measure:
      - Benchmark results: benchmarking.md
      - Datasets: datasets.md
      - Metric definitions: evaluation_metrics.md
      - Reproducibility: reproducibility.md
      - CPU performance: performance.md
      - GPU compute: gpu.md
  - Reference:
      - Python API: api.md
      - Troubleshooting: troubleshooting.md
      - Contributing: contributing.md
      - Credits: credits.md
